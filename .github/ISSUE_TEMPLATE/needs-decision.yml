name: Needs decision
description: A consequential choice the maintainer must ratify before work proceeds.
labels: ["needs-decision"]
body:
  - type: textarea
    id: decision
    attributes:
      label: The decision to be made
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options and tradeoffs
      description: Each option with its consequence and reversibility. Include a recommendation.
    validations:
      required: true
  - type: textarea
    id: blocks
    attributes:
      label: What this blocks
